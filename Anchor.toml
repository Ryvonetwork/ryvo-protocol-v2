[toolchain]
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
ryvo_protocol = "DD7m7B1FggiCQCURQ2pNXyDtPZPRdJYYgq9dthtaJtii"

[programs.devnet]
ryvo_protocol = "DD7m7B1FggiCQCURQ2pNXyDtPZPRdJYYgq9dthtaJtii"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
# Run by `arcium test` against the Arcium localnet: the custody suite plus the clearing suite.
# `npm test` runs only tests/ on a plain validator (scripts/test.sh) and is much faster.
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\" \"tests-arcium/**/*.ts\""

[hooks]

[test.validator]
startup_wait = 10000

# Load the program upgradeable with the provider wallet as upgrade authority. Without this the
# genesis-loaded program has an unusable authority and `initialize` — gated on the upgrade
# authority so the fixed-seed Config cannot be front-run — is uncallable under `arcium test`.
[[test.genesis]]
address = "DD7m7B1FggiCQCURQ2pNXyDtPZPRdJYYgq9dthtaJtii"
program = "target/deploy/ryvo_protocol.so"
upgradeable = true
