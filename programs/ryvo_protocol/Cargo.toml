[package]
name = "ryvo_protocol"
version = "0.1.0"
description = "Ryvo protocol: unilateral cumulative payment channels on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ryvo_protocol"

[features]
# custom-heap: see the allocator in lib.rs — seal_and_queue_* needs more than the 32 KB default.
default = ["custom-heap"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "arcium-anchor/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# NOTE: `init-if-needed` is deliberately NOT enabled. Every account is created by an
# explicit instruction so that account creation can never be an implicit side effect of
# a money-moving instruction.
anchor-lang = "1.0.2"
arcium-anchor = "=0.14.1"
arcium-client = { default-features = false, version = "=0.14.1" }
arcium-macros = "=0.14.1"
# Zero-copy staging buffer (Anchor `#[account(zero_copy)]`).
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
# The program is legacy-SPL-Token-only. That guarantee is enforced by
# `Program<'info, Token>` on every token-touching instruction, which pins the token program
# to the legacy SPL Token address and therefore rejects token-2022 mints — whose transfer
# fees, transfer hooks and confidential transfers would each break the solvency invariant
# `vault.amount == sum(available) + sum(locked)`. We use `anchor_spl::token`
# types exclusively and never `token_interface`.
#
# `token_2022` is enabled only because anchor-spl 1.0.2's `idl_build.rs` references
# `crate::token_interface` unconditionally, so `anchor-spl/idl-build` — which the `Accounts`
# derive needs for `insert_types` on `Mint`/`TokenAccount` — fails to compile without it.
# It widens the dependency tree, not the set of mints the program accepts.
anchor-spl = { version = "1.0.2", default-features = false, features = [
    "token",
    "token_2022",
] }
# Syscall-backed SHA-256. Used for the message domain and the commitment digest. Never the
# software `sha2` crate: the prior POC measured ~1M CU for 12.8KB there versus ~7k CU for the
# syscall, and the settlement path hashes once per channel.
solana-sha256-hasher = "3.1.0"
# Host-side commitment digest (SHA3-256). No instruction calls it: the Arcis circuit computes the
# same digest in-MPC and settlement reads the sealed staged bytes, so this never runs on-chain.
sha3 = { version = "0.10", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
