[workspace]
# `encrypted-ixs` is intentionally excluded from the v1 workspace: v1 has no Arcis circuit,
# and excluding it keeps `anchor build` / `anchor test` off the Arcium localnet path. The
# directory and Arcium.toml remain on disk untouched for v2, which re-adds it here.
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
